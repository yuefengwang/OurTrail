<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>基样 · 目标页（八项已声明偏差）</title>
<link rel="stylesheet" href="../assets/sheet.css">
<style>
  /* Eight declared deviations, one per cell. Nothing else may move. */
  #pos-8 { left: 7px; }                 /* 位置 -8px */
  #gap-4 { padding: 16px; }             /* 间距 +4px */
  #fs-label { font-size: 19px; }        /* 字号 16 → 19 */
  #lh-label { line-height: 30px; }      /* 行高 18 → 30 */
  #radius-box { border-radius: 2px; }   /* 圆角 12 → 2 */
  #color-label { color: #8c8c8c; }      /* 文字颜色 #333 → #8c8c8c */
  #crop-img { object-position: right center; }   /* 图片裁切左半 → 右半 */
  #wrap-text { letter-spacing: 0.9px; }          /* 换行 2 行 → 3 行 */
</style>
</head>
<body>
<div id="device">
  <div id="sheet">
    <h1 id="title">组件基样 · 12 格</h1>
    <p id="subtitle">参考侧（prototype）：四格对照 + 八项偏差</p>

    <div class="cell" id="ctrl-1">
      <div class="cap">对照 1</div>
      <div class="bar"></div>
    </div>
    <div class="cell" id="ctrl-2">
      <div class="cap">对照 2</div>
      <div class="bar"></div>
    </div>

    <div class="cell" id="pos-8">
      <div class="cap">位置 8px</div>
      <div class="bar"></div>
    </div>
    <div class="cell" id="gap-4">
      <div class="cap">间距 4px</div>
      <div class="bar"></div>
    </div>

    <div class="cell" id="font-size">
      <div class="cap">字号</div>
      <div class="probe" id="fs-label">山脊线刻度</div>
    </div>
    <div class="cell" id="line-height">
      <div class="cap">行高</div>
      <div class="probe-lh" id="lh-label">两行文字的行距</div>
    </div>

    <div class="cell" id="radius">
      <div class="cap">圆角</div>
      <div id="radius-box"></div>
    </div>
    <div class="cell" id="color">
      <div class="cap">文字颜色</div>
      <div id="color-label">光到不了山体</div>
    </div>

    <div class="cell" id="crop">
      <div class="cap">图片裁切</div>
      <img id="crop-img" src="../assets/stripes.png" alt="">
    </div>
    <div class="cell" id="wrap">
      <div class="cap">换行</div>
      <p id="wrap-text">the ridgeline sinks into a sea of cloud</p>
    </div>

    <div class="cell" id="ctrl-3">
      <div class="cap">对照 3</div>
      <div class="bar"></div>
    </div>
    <div class="cell" id="ctrl-4">
      <div class="cap">对照 4</div>
      <div class="bar"></div>
    </div>

    <button id="toggle">展开说明</button>
    <p id="note">说明已收起</p>
  </div>
</div>
<script>
  document.getElementById('toggle').addEventListener('click', function () {
    var open = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!open));
    this.textContent = open ? '展开说明' : '收起说明';
    document.getElementById('note').textContent = open ? '说明已收起' : '说明已展开';
  });
</script>
</body>
</html>
