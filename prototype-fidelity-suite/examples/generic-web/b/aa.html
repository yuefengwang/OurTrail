<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>实验 B · 抗锯齿差异（应被容忍）</title>
<link rel="stylesheet" href="../assets/card.css">
<style>
  /* Anti-aliasing surrogate, measured rather than assumed.
     Putting the text on its own composited layer makes Chromium skip subpixel
     (LCD) text rendering and fall back to grayscale AA. No metric moves: every
     box, font-size and line-height is identical to b/base.html.
     Measured by examples/generic-web/experiments/probe-aa.js (aa-probe.json):
       pixel 0.50 %–4.74 % per text run, ink ratio 0.984–1.129 (all PASS).
     Launch flags and three CSS treatments were tried first and measured zero
     difference in this headless Chromium (--disable-font-subpixel-positioning,
     --font-render-hinting=none, text-rendering:geometricPrecision,
     -webkit-font-smoothing) — those are recorded as no-ops, not as evidence. */
  #b-title, #b-label, #b-clock, #b-desc, #b-btn, #b-note {
    will-change: transform;
    transform: translateZ(0);
  }
</style>
</head>
<body>
<div id="device">
  <div id="sheet">
    <h1 id="b-title">登山计划</h1>
    <div id="b-card">
      <div id="b-label">出发时间</div>
      <div id="b-clock">06:00</div>
      <p id="b-desc">山脊线一带云量较低，适合早起出发。</p>
    </div>
    <img id="b-img" src="../assets/stripes.png" alt="">
    <button id="b-btn">展开说明</button>
    <p id="b-note">说明已收起</p>
  </div>
</div>
<script src="../assets/card.js"></script>
</body>
</html>
