<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>维修工单 · 详情</title>
<style>
  :root {
    --paper: #fbf8f2;
    --backdrop: #e7e2d8;
    --ink: #232a25;
    --muted: #6d7168;
    --surface: #fffdf9;
    --rule: #ddd8cc;
    --signal: #c2410c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--backdrop); }
  #frame { width: 390px; min-height: 844px; background: var(--paper); }
  #screen { padding: 20px 16px 28px; }
  .head { margin-bottom: 16px; }
  .head h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
  .head p { margin: 4px 0 0; font-size: 12px; line-height: 18px; color: var(--signal); }
  .log { border-top: 1px solid var(--rule); }
  .log div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .log span { font-size: 13px; line-height: 20px; }
  .log time { font-size: 12px; line-height: 18px; color: var(--muted); }
  .foot { margin-top: 20px; font-size: 12px; line-height: 18px; color: var(--muted); }
</style>
</head>
<body>
<div id="frame">
  <div id="screen">
    <div class="head">
      <h1>三楼水龙头</h1>
      <p>状态：待派单</p>
    </div>
    <div class="log">
      <div><span>报修登记</span><time>10 月 20 日 09:12</time></div>
      <div><span>现场确认</span><time>10 月 20 日 14:30</time></div>
      <div><span>等待师傅接单</span><time>—</time></div>
    </div>
    <div class="foot">紧急情况请拨门房分机 801。</div>
  </div>
</div>
</body>
</html>
