<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>s08 抗辩 A · 原型（label 14 / value 16）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.5 system-ui, sans-serif; color: #1f2a26; background: #f5f5f0; }
  #frame { width: 390px; min-height: 844px; padding: 20px 16px 0; }
  .h-title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
  .h-label { margin: 16px 0 0; width: 120px; height: 20px; font-size: 14px; line-height: 20px; color: #5a6660; overflow: hidden; }
  .h-value { margin: 0; width: 160px; height: 24px; font-size: 16px; line-height: 24px; font-weight: 600; color: #1f2a26; }
  .h-note { margin: 14px 0 0; font-size: 13px; line-height: 19px; color: #5a6660; }
  .h-btn { margin-top: 18px; height: 38px; padding: 0 16px; font-size: 14px; border: 1px solid #b9c7c0; border-radius: 8px; background: #ffffff; color: #1f2a26; }
  .h-out { margin: 10px 0 0; font-size: 12px; line-height: 16px; color: #6b6b6b; }
</style>
</head>
<body>
<div id="frame">
  <h1 class="h-title" id="h-title">集合确认</h1>
  <p class="h-label" id="h-label">出发时间</p>
  <p class="h-value" id="h-value">07:30</p>
  <p class="h-note" id="h-note">请提前 10 分钟到达。</p>
  <button class="h-btn" id="h-btn">显示确认</button>
  <p class="h-out" id="h-out">未确认</p>
</div>
<script>
  document.getElementById('h-btn').addEventListener('click', function () {
    document.getElementById('h-out').textContent = '已确认';
  });
</script>
</body>
</html>
