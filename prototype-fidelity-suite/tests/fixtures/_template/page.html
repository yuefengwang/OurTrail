<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夹具格式样例</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.5 system-ui, sans-serif; color: #1f2a26; background: #f5f5f0; }
  #frame { width: 390px; min-height: 100vh; padding: 24px 16px 0; }
  h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
  button { margin-top: 16px; height: 38px; padding: 0 16px; font-size: 14px; border: 1px solid #b9c7c0; border-radius: 8px; background: #fff; }
  p { margin: 10px 0 0; font-size: 12px; line-height: 16px; color: #6b6b6b; }
</style>
</head>
<body>
<div id="frame">
  <h1 id="t-title">出发前的检查</h1>
  <button id="t-btn">展开说明</button>
  <p id="t-note">说明已收起</p>
</div>
<script>
  document.getElementById('t-btn').addEventListener('click', function () {
    document.getElementById('t-note').textContent = '说明已展开';
  });
</script>
</body>
</html>
