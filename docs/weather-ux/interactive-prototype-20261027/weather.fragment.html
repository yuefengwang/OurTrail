<script>
(function(){

    {id:'end',name:'下撤终点',ele:3100,lat:29.90,lng:99.69,kind:'终点'}
  ];
  const initial={
    screen:'weather',mode:'route',tab:'route',homeTab:'plans',pointId:'lookout',day:1,hour:13,period:24,date:'2026-10-31',
    startDate:'2026-10-31',planName:'格聂 · 周末两日徒步',routeName:'格聂两日路线',points:basePoints,
    stops:[{id:'s1',pointId:'start',day:1,time:'08:00'},{id:'s2',pointId:'lookout',day:1,time:'13:30'},{id:'s3',pointId:'camp',day:1,time:'17:00'},{id:'s4',pointId:'camp',day:2,time:'08:00'},{id:'s5',pointId:'pass',day:2,time:'11:00'},{id:'s6',pointId:'end',day:2,time:'16:00'}],
    savedPoints:['lookout'],savedPlan:true,savedRoute:true,signedIn:true,scenario:'normal',customPoint:null,fromActivity:false,toast:'',draft:null,importPoints:null,importName:'',pickerChoice:'lookout'

  initial.planRecords=[{id:'plan-base',routeId:'route-base',name:initial.planName,startDate:initial.startDate,routeName:initial.routeName,points:structuredClone(basePoints),stops:structuredClone(initial.stops)}];
  let state=structuredClone(initial);
  const settings={width:390,scenario:'normal',scene:'沿途天气'};
  let drawnWidth=0;
  const writerId='weather-preview-'+Date.now();
  let writeRevision=0;
  let chartObserver;
  let framePending=false;
  let chartGeometry=null;
  const clone=value=>JSON.parse(JSON.stringify(value));
  const escape=value=>String(value==null?'':value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const icon=name=>'<i data-lucide="'+name+'" class="ot-icon" aria-hidden="true"></i>';
  const action=(name,label,classes,attrs)=>'<button type="button" class="cursor-interaction '+(classes==null?'ot-button':classes)+'" data-action="'+name+'" '+(attrs||'')+'>'+label+'</button>';
  const dateAdd=(date,days)=>new Date(Date.parse(date+'T00:00:00Z')+days*86400000).toISOString().slice(0,10);

  const pad=value=>String(value).padStart(2,'0');
  const timeLabel=hour=>pad(Math.floor(hour)%24)+':00';
  const point=()=>state.mode==='point'&&state.customPoint?state.customPoint:state.points.find(item=>item.id===state.pointId)||state.points[0];
  const byId=pointId=>state.points.find(item=>item.id===pointId)||state.points[0];
  const forecastAllowed=date=>{const diff=(Date.parse(date+'T00:00:00Z')-Date.parse('2026-10-27T00:00:00Z'))/86400000;return diff>=0&&diff<=14&&state.scenario!=='outside';};
  function cloudAmount(hour,altitude,offset){
    const phase=hour+offset*1.8;
    const lowerCenter=2850+260*Math.sin(phase/4)+230*Math.cos(phase/7);
    const upperCenter=4950+350*Math.sin((phase+5)/6);
    const lower=95*Math.exp(-Math.pow((altitude-lowerCenter)/440,2))*(.67+.28*Math.cos((phase-4)/5));
    const upper=72*Math.exp(-Math.pow((altitude-upperCenter)/650,2))*(.62+.36*Math.cos((phase-17)/6));
    const bridge=76*Math.exp(-Math.pow((phase%24-17)/3.1,2)-Math.pow((altitude-3700)/920,2));
    return Math.max(0,Math.min(100,lower+upper+bridge));
  }
  function forecast(location,hour,date){
    const locationIndex=Math.max(0,state.points.findIndex(item=>item.id===location.id));
    const shift=((Date.parse(date+'T00:00:00Z')-Date.parse('2026-10-31T00:00:00Z'))/86400000)*1.4;

  function contourPaths(period,location,threshold,chartLeft,chartTop,chartWidth,chartHeight){
    const columns=97,rows=53;
    const locationIndex=Math.max(0,state.points.findIndex(item=>item.id===location.id));
    const dateShift=((Date.parse(state.date+'T00:00:00Z')-Date.parse('2026-10-31T00:00:00Z'))/86400000)*1.4;
    const values=Array.from({length:rows},(_,row)=>Array.from({length:columns},(_,column)=>{
      if(row===0||row===rows-1||column===0||column===columns-1)return 0;
      return cloudAmount((column-1)/(columns-3)*(period-1)+dateShift+locationIndex*.35,6500-(row-1)/(rows-3)*4700,locationIndex);
    }));
    const edges=[];
    const cases={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,2],[0,1]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[2,0]],10:[[0,3],[1,2]],11:[[2,1]],12:[[1,3]],13:[[1,0]],14:[[0,3]]};
    for(let row=0;row<rows-1;row++){
      for(let column=0;column<columns-1;column++){
        const corners=[values[row][column],values[row][column+1],values[row+1][column+1],values[row+1][column]];
        const mask=corners.reduce((result,value,index)=>result+(value>=threshold?(1<<index):0),0);
        if(!cases[mask])continue;
        const cornerPositions=[[column,row],[column+1,row],[column+1,row+1],[column,row+1]];
        const edgeCorners=[[0,1],[1,2],[2,3],[3,0]];
        const interpolate=edge=>{
          const pair=edgeCorners[edge],start=pair[0],end=pair[1];
          const ratio=(threshold-corners[start])/(corners[end]-corners[start]);
          return [cornerPositions[start][0]+ratio*(cornerPositions[end][0]-cornerPositions[start][0]),cornerPositions[start][1]+ratio*(cornerPositions[end][1]-cornerPositions[start][1])];
        };
        let pairs=cases[mask];
        if((mask===5||mask===10)&&corners.reduce((sum,value)=>sum+value,0)/4>=threshold)pairs=mask===5?[[3,0],[1,2]]:[[0,1],[2,3]];
        pairs.forEach(pair=>edges.push([interpolate(pair[0]),interpolate(pair[1])]));
      }
    }
    const key=position=>position[0].toFixed(4)+','+position[1].toFixed(4);
    const adjacency=new Map();
    edges.forEach((edge,index)=>edge.forEach((position,side)=>{
      const identity=key(position);
      if(!adjacency.has(identity))adjacency.set(identity,[]);
      adjacency.get(identity).push({index,side});
    }));
    const used=new Set(),paths=[];
    edges.forEach((edge,index)=>{
      if(used.has(index))return;
      used.add(index);
      const points=[edge[0],edge[1]];
      let current=edge[1];
      while(key(current)!==key(points[0])){
        const next=(adjacency.get(key(current))||[]).find(item=>!used.has(item.index));
        if(!next)break;
        used.add(next.index);
        current=edges[next.index][1-next.side];
        points.push(current);
      }
      if(points.length<5||key(current)!==key(points[0]))return;
      paths.push(points.map((position,positionIndex)=>(positionIndex?'L':'M')+(chartLeft+(position[0]-1)/(columns-3)*chartWidth).toFixed(2)+','+(chartTop+(position[1]-1)/(rows-3)*chartHeight).toFixed(2)).join('')+'Z');
    });
    return paths.join('');
  }
  function drawChart(width){
    const chart=root.querySelector('#ot-chart');
    if(!chart||!width)return;
    const location=point(),large=state.tab==='cloud';
    const left=48,right=10,plotWidth=width-left-right;
    const cloudTop=large?28:161,cloudHeight=large?260:178;
    const tempTop=large?cloudTop+cloudHeight+35:25;
    const rainTop=large?tempTop+68:96;
    const windTop=large?rainTop+66:cloudTop+cloudHeight+32;
    const bottom=windTop+61,height=bottom+32;
    const horizontal=hour=>left+hour/(state.period-1)*plotWidth;
    const vertical=altitude=>cloudTop+(6500-altitude)/4700*cloudHeight;
    const series=Array.from({length:state.period},(_,hour)=>forecast(location,hour,state.date));
    const tempMinimum=Math.floor((Math.min.apply(null,series.map(item=>item.temperature))-2)/5)*5;
    const tempMaximum=Math.ceil((Math.max.apply(null,series.map(item=>item.temperature))+2)/5)*5;
    const tempY=temperature=>tempTop+45-(temperature-tempMinimum)/(tempMaximum-tempMinimum)*40;
    const windMaximum=Math.ceil(Math.max.apply(null,series.map(item=>item.gust))/10)*10;
    const windY=wind=>windTop+43-wind/windMaximum*38;
    let content='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'" role="img" aria-label="'+escape(location.name)+'的'+state.period+'小时示例天气图，横轴为北京时间，云层纵轴为海拔米"><defs><clipPath id="ot-cloud-clip"><rect x="'+left+'" y="'+cloudTop+'" width="'+plotWidth+'" height="'+cloudHeight+'"/></clipPath></defs>';
    const tickCount=width<330?4:5;
    const ticks=Array.from({length:tickCount},(_,index)=>Math.round(index*(state.period-1)/(tickCount-1)));
    for(let hour=0;hour<state.period;hour++){
      if(hour%24<6||hour%24>=19)content+='<rect x="'+horizontal(hour).toFixed(2)+'" y="10" width="'+(plotWidth/(state.period-1)+.2).toFixed(2)+'" height="'+(bottom-10)+'" fill="var(--ot-stone)" opacity=".33"/>';
    }
    ticks.forEach(hour=>{
      content+='<line x1="'+horizontal(hour)+'" x2="'+horizontal(hour)+'" y1="12" y2="'+bottom+'" stroke="var(--ot-line)" opacity=".5"/>';
      const label=state.period===24?pad(hour)+':00':(Math.floor(hour/24)+1)+'日 '+pad(hour%24)+'时';
      content+='<text x="'+horizontal(hour)+'" y="'+(bottom+22)+'" text-anchor="'+(hour===0?'start':hour===state.period-1?'end':'middle')+'">'+label+'</text>';
    });
    content+='<text x="0" y="'+(cloudTop+8)+'" class="ot-axis-heading">海拔 m</text>';
    if(state.scenario!=='missing'){
      content+='<g clip-path="url(#ot-cloud-clip)">';
      [20,40,60,80,95].forEach((threshold,index)=>{content+='<path d="'+contourPaths(state.period,location,threshold,left,cloudTop,plotWidth,cloudHeight)+'" fill="var(--ot-cloud'+(index+1)+')"/>';});
      content+='</g>';
    }else{
      content+='<rect x="'+left+'" y="'+cloudTop+'" width="'+plotWidth+'" height="'+cloudHeight+'" fill="var(--ot-stone)" opacity=".5"/><text x="'+(left+plotWidth/2)+'" y="'+(cloudTop+cloudHeight/2)+'" text-anchor="middle">云层数据缺失</text>';
    }
    [2000,3000,4000,5000,6000].forEach(altitude=>{
      content+='<text x="'+(left-8)+'" y="'+(vertical(altitude)+4)+'" text-anchor="end">'+altitude+'</text><line x1="'+left+'" x2="'+(width-right)+'" y1="'+vertical(altitude)+'" y2="'+vertical(altitude)+'" stroke="var(--ot-line)" opacity=".55"/>';
    });
    if(location.ele!=null&&location.ele>=1800&&location.ele<=6500){
      const referenceY=vertical(location.ele);
      content+='<line class="ot-reference" x1="'+left+'" x2="'+(width-right)+'" y1="'+referenceY+'" y2="'+referenceY+'"/><rect x="'+(width-right-89)+'" y="'+(referenceY-19)+'" width="89" height="17" fill="var(--ot-surface)" opacity=".92"/><text x="'+(width-right-3)+'" y="'+(referenceY-6)+'" text-anchor="end" class="ot-value-label">地点 '+location.ele+' m</text>';
    }
    content+='<text x="0" y="'+(tempTop+7)+'" class="ot-axis-heading">温度 °C</text><text x="'+(left-8)+'" y="'+(tempTop+24)+'" text-anchor="end">'+tempMaximum+'°</text><text x="'+(left-8)+'" y="'+(tempTop+47)+'" text-anchor="end">'+tempMinimum+'°</text>';
    const line=(field,verticalFunction)=>series.map((item,index)=>(index?'L':'M')+horizontal(index).toFixed(2)+','+verticalFunction(item[field]).toFixed(2)).join('');
    content+='<path d="'+line('temperature',tempY)+'" fill="none" stroke="var(--ot-temp)" stroke-width="1.8" stroke-linejoin="round"/>';
    content+='<text x="0" y="'+(rainTop+6)+'" class="ot-axis-heading">降水</text><text x="0" y="'+(rainTop+20)+'">mm/h</text><text x="'+(left-8)+'" y="'+(rainTop+43)+'" text-anchor="end">0</text>';
    series.forEach((item,index)=>{
      if(item.rain<=0)return;
      const barWidth=Math.max(1,plotWidth/state.period*.68),barHeight=item.rain/4*36;
      content+='<rect x="'+(horizontal(index)-barWidth/2).toFixed(2)+'" y="'+(rainTop+40-barHeight).toFixed(2)+'" width="'+barWidth.toFixed(2)+'" height="'+barHeight.toFixed(2)+'" fill="var(--ot-rain)" opacity=".8"/>';
    });
    content+='<text x="0" y="'+(windTop+7)+'" class="ot-axis-heading">风</text><text x="0" y="'+(windTop+21)+'">km/h</text><text x="'+(left-8)+'" y="'+(windTop+7)+'" text-anchor="end">'+windMaximum+'</text><text x="'+(left-8)+'" y="'+(windTop+46)+'" text-anchor="end">0</text><path d="'+line('gust',windY)+'" fill="none" stroke="var(--ot-gust)" stroke-width="1.4"/><path d="'+line('wind',windY)+'" fill="none" stroke="var(--ot-wind)" stroke-width="1.7"/>';
    content+='<g id="ot-chart-cursor"><line id="ot-cursor-line" x1="'+horizontal(state.hour)+'" x2="'+horizontal(state.hour)+'" y1="10" y2="'+bottom+'" stroke="var(--ot-forest)" stroke-width="1.2"/><circle id="ot-temp-dot" cx="'+horizontal(state.hour)+'" cy="'+tempY(series[state.hour].temperature)+'" r="3.2" fill="var(--ot-temp)" stroke="var(--ot-surface)" stroke-width="1.3"/></g>';
    content+='<rect id="ot-chart-hit" x="'+left+'" y="10" width="'+plotWidth+'" height="'+(bottom-10)+'" fill="transparent"/></svg>';
    chart.innerHTML=content;
    chartGeometry={left,width:plotWidth,horizontal,tempY,series};
  }
  function updateHour(value){

    const mainDetail=root.querySelector('#ot-main-detail');
    if(mainDetail)mainDetail.textContent='降水 '+data.rain+' mm/h · 风速 '+data.wind+' km/h';
    const details=root.querySelector('#ot-detail-facts');
    if(details)details.innerHTML=facts(data);

      const guide=root.querySelector('#ot-cursor-line'),dot=root.querySelector('#ot-temp-dot');

  }

  root.addEventListener('change',async event=>{
    const target=event.target;
    if(target.id==='ot-node'){state.pointId=target.value;render();remember();}
    else if(target.id==='ot-query-date'&&target.value){state.date=target.value;render();remember();}

        const documentData=new DOMParser().parseFromString(await file.text(),'application/xml');
        if(documentData.querySelector('parsererror'))throw new Error('GPX 文件格式无法解析。');
        const raw=Array.from(documentData.getElementsByTagNameNS('*','trkpt'));
        const routePoints=raw.length?raw:Array.from(documentData.getElementsByTagNameNS('*','rtept'));
        const valid=routePoints.filter(element=>Number.isFinite(Number(element.getAttribute('lat')))&&Number.isFinite(Number(element.getAttribute('lon')))&&Math.abs(Number(element.getAttribute('lat')))<=90&&Math.abs(Number(element.getAttribute('lon')))<=180);
        if(valid.length<2)throw new Error('至少需要两个有效轨迹点。');
        const count=Math.min(6,valid.length);
        state.importPoints=Array.from({length:count},(_,index)=>{
          const element=valid[Math.round(index*(valid.length-1)/(count-1))];
          const elevationElement=element.getElementsByTagNameNS('*','ele')[0];
          const nameElement=element.getElementsByTagNameNS('*','name')[0];
          const elevation=elevationElement&&elevationElement.textContent.trim()!==''?Number(elevationElement.textContent):null;
          return {id:'gpx-'+index,name:nameElement?nameElement.textContent.slice(0,40):(index===0?'轨迹起点':index===count-1?'轨迹终点':'关键点 '+index),lat:Number(element.getAttribute('lat')),lng:Number(element.getAttribute('lon')),ele:Number.isFinite(elevation)?Math.round(elevation):null,kind:'GPX采样点'};
        });
        state.importName=file.name;render();
      }catch(problem){error.textContent=problem.message||'读取失败，请换一个 GPX 文件。';}
    }
  });
  root.addEventListener('submit',event=>{
    event.preventDefault();
    if(event.target.id==='ot-plan-form'){
      const draft=state.draft;
      const error=root.querySelector('#ot-plan-error');
      if(!draft.name.trim()||!draft.date){error.textContent='请填写计划名称与出发日期。';return;}
      let previous=-1,previousDay=0;
      for(const stop of draft.stops){
        const value=(stop.day-1)*1440+(stop.time?Number(stop.time.slice(0,2))*60+Number(stop.time.slice(3)):0);
        if(stop.day<previousDay){error.textContent='节点所属日期须按路线顺序递增。';return;}
        if(stop.time&&value<previous){error.textContent='节点抵达时间须按路线顺序递增；跨天请调整“第几天”。';return;}
        previousDay=stop.day;
        if(stop.time)previous=value;
      }
      state.planName=draft.name.trim();state.startDate=draft.date;state.stops=clone(draft.stops);state.currentPlanId=draft.id||'plan-'+Date.now();state.savedPlan=true;state.scenario='normal';
      const saved={id:state.currentPlanId,routeId:state.currentRouteId,name:state.planName,startDate:state.startDate,routeName:state.routeName,points:clone(state.points),stops:clone(state.stops)};
      const existing=state.planRecords.findIndex(plan=>plan.id===saved.id);
      if(existing>=0)state.planRecords[existing]=saved;else state.planRecords.push(saved);
      state.draft=null;openRoute();
      notify('个人计划已保存（原型）· 不会修改活动或原始轨迹。');
      render();remember();
    }else if(event.target.id==='ot-coordinate-form'){
      const data=new FormData(event.target);
      const latitude=Number(data.get('latitude')),longitude=Number(data.get('longitude'));
      const elevation=String(data.get('elevation')).trim();
      if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180){root.querySelector('#ot-coordinate-error').textContent='请填写有效经纬度。';return;}
      state.customPoint={id:'manual-'+Date.now(),name:String(data.get('name')).trim()||'坐标查询点',lat:latitude,lng:longitude,ele:elevation===''?null:Number(elevation),manual:true,coordinateSystem:data.get('coordinateSystem')};
      state.pointId=state.customPoint.id;state.mode='point';state.screen='weather';state.tab='cloud';state.date='2026-10-31';state.hour=13;state.period=24;state.scenario='normal';
      render();remember();
    }
  });
  root.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.target.tagName!=='INPUT')return;
    const form=event.target.closest('form');
    if(!form)return;
    event.preventDefault();
    if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  });
  root.addEventListener('pointerdown',event=>{
    const hit=event.target.closest('#ot-chart-hit');
    if(!hit||!chartGeometry)return;
    hit.setPointerCapture(event.pointerId);
    const chart=root.querySelector('#ot-chart');
    updateHour((event.clientX-chart.getBoundingClientRect().left-chartGeometry.left)/chartGeometry.width*(state.period-1));
  });
  root.addEventListener('pointermove',event=>{
    if(!event.target.closest('#ot-chart-hit')||!event.buttons||!chartGeometry||framePending)return;
    framePending=true;
    requestAnimationFrame(()=>{
      const chart=root.querySelector('#ot-chart');
      if(chart)updateHour((event.clientX-chart.getBoundingClientRect().left-chartGeometry.left)/chartGeometry.width*(state.period-1));
      framePending=false;
    });
  });
  root.addEventListener('pointerup',event=>{if(event.target.closest('#ot-chart-hit'))remember();});
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{
      state.toast='';state.scenario=settings.scenario;
      if(settings.scene==='天气首页')state.screen='home';
      else if(settings.scene==='沿途天气')openRoute();
      else if(settings.scene==='单点云层'){openPoint('lookout','cloud');}
      else if(settings.scene==='行程编辑'){beginEdit();}
      else if(settings.scene==='活动入口')state.screen='activity';
      render();
    }});
    tweak.addSelect(settings,'scene',{label:'查看场景',options:['沿途天气','天气首页','单点云层','行程编辑','活动入口']});
    tweak.addSelect(settings,'scenario',{label:'数据状态',options:[{label:'正常示例',value:'normal'},{label:'云层缺测',value:'missing'},{label:'超出预报范围',value:'outside'},{label:'离线缓存',value:'offline'},{label:'未安排时间',value:'unscheduled'}]});
    tweak.addSlider(settings,'width',{label:'小程序宽度',min:320,max:430,step:1,unit:'px'});
  }
})();
</script>
