  function contourPaths(period,location,threshold,chartLeft,chartTop,chartWidth,chartHeight){
    const columns=97,rows=53;
    const window=cloudWindow();
    const locationIndex=Math.max(0,state.points.findIndex(item=>item.id===location.id));
    const dateShift=((Date.parse(state.date+'T00:00:00Z')-Date.parse('2026-10-31T00:00:00Z'))/86400000)*1.4;
    const values=Array.from({length:rows},(_,row)=>Array.from({length:columns},(_,column)=>{
      if(row===0||row===rows-1||column===0||column===columns-1)return 0;
      const sample=(column-1)/(columns-3)*(period-1),hour=Math.floor(sample),fraction=sample-hour;
      const altitude=window.high-(row-1)/(rows-3)*(window.high-window.low);
      return cloudAmount(hour+dateShift+locationIndex*.35,altitude,locationIndex)*(1-fraction)+cloudAmount(hour+1+dateShift+locationIndex*.35,altitude,locationIndex)*fraction;
    }));
    const edges=[];
    const cases={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,2],[0,1]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[2,0]],10:[[0,3],[1,2]],11:[[2,1]],12:[[1,3]],13:[[1,0]],14:[[0,3]]};
    for(let row=0;row<rows-1;row++){
      for(let column=0;column<columns-1;column++){
        const corners=[values[row][column],values[row][column+1],values[row+1][column+1],values[row+1][column]];
        const mask=corners.reduce((result,value,index)=>result+(value>=threshold?(1<<index):0),0);
        if(!cases[mask])continue;
        const cornerPositions=[[column,row],[column+1,row],[column+1,row+1],[column,row+1]];
        const edgeCorners=[[0,1],[1,2],[2,3],[3,0]];
        const interpolate=edge=>{
          const pair=edgeCorners[edge],start=pair[0],end=pair[1];
          const ratio=(threshold-corners[start])/(corners[end]-corners[start]);
          return [cornerPositions[start][0]+ratio*(cornerPositions[end][0]-cornerPositions[start][0]),cornerPositions[start][1]+ratio*(cornerPositions[end][1]-cornerPositions[start][1])];
        };
        let pairs=cases[mask];
        if((mask===5||mask===10)&&corners.reduce((sum,value)=>sum+value,0)/4>=threshold)pairs=mask===5?[[3,0],[1,2]]:[[0,1],[2,3]];
        pairs.forEach(pair=>edges.push([interpolate(pair[0]),interpolate(pair[1])]));
      }
    }
    const key=position=>position[0].toFixed(4)+','+position[1].toFixed(4);
    const adjacency=new Map();
    edges.forEach((edge,index)=>edge.forEach((position,side)=>{
      const identity=key(position);
      if(!adjacency.has(identity))adjacency.set(identity,[]);
      adjacency.get(identity).push({index,side});
    }));
    const used=new Set(),paths=[];
    edges.forEach((edge,index)=>{
      if(used.has(index))return;
      used.add(index);
      const points=[edge[0],edge[1]];
      let current=edge[1];
      while(key(current)!==key(points[0])){
        const next=(adjacency.get(key(current))||[]).find(item=>!used.has(item.index));
        if(!next)break;
        used.add(next.index);
        current=edges[next.index][1-next.side];
        points.push(current);
      }
      if(points.length<5||key(current)!==key(points[0]))return;
      paths.push(points.map((position,positionIndex)=>(positionIndex?'L':'M')+(chartLeft+(position[0]-1)/(columns-3)*chartWidth).toFixed(2)+','+(chartTop+(position[1]-1)/(rows-3)*chartHeight).toFixed(2)).join('')+'Z');
    });
    return paths.join('');
  }

    const cloudTop=large?28:161,cloudHeight=large?260:178;

    const windTop=large?rainTop+66:cloudTop+cloudHeight+32;
    const bottom=windTop+61,height=bottom+32;
    const horizontal=hour=>left+hour/(state.period-1)*plotWidth;

      content+='</g>';
      gaps.forEach(gap=>{content+='<rect class="ot-missing-hour" x="'+gap.left+'" y="'+cloudTop+'" width="'+(gap.right-gap.left)+'" height="'+cloudHeight+'" fill="url(#ot-gap-pattern)"/>';});
    }else{
      content+='<rect x="'+left+'" y="'+cloudTop+'" width="'+plotWidth+'" height="'+cloudHeight+'" fill="var(--ot-stone)" opacity=".5"/><text x="'+(left+plotWidth/2)+'" y="'+(cloudTop+cloudHeight/2)+'" text-anchor="middle">云层数据缺失</text>';
    }
    Array.from({length:9},(_,index)=>index*1000).filter(altitude=>altitude>window.low+100&&altitude<window.high-100).forEach(altitude=>{
      content+='<text x="'+(left-8)+'" y="'+(vertical(altitude)+4)+'" text-anchor="end">'+altitude+'</text><line x1="'+left+'" x2="'+(width-right)+'" y1="'+vertical(altitude)+'" y2="'+vertical(altitude)+'" stroke="var(--ot-line)" opacity=".55"/>';
    });

      const referenceY=vertical(location.ele);
      const labelY=Math.max(cloudTop+16,Math.min(cloudTop+cloudHeight-5,referenceY-6));
      content+='<line class="ot-reference" x1="'+left+'" x2="'+(width-right)+'" y1="'+referenceY+'" y2="'+referenceY+'"/><rect x="'+(width-right-96)+'" y="'+(labelY-13)+'" width="96" height="17" fill="var(--ot-surface)" opacity=".92"/><text x="'+(width-right-3)+'" y="'+labelY+'" text-anchor="end" class="ot-value-label">地点 '+location.ele+' m</text>';

  function updateHour(value){
    state.hour=Math.max(0,Math.min(state.period-1,Math.round(value)));
    const data=forecast(point(),state.hour,state.date);
    const readoutNode=root.querySelector('#ot-readout');
    if(readoutNode)readoutNode.innerHTML=readout();
    const temperature=root.querySelector('#ot-main-temperature');
    if(temperature)temperature.innerHTML=data.temperature+'<span>°C</span>';
    const mainWeather=root.querySelector('#ot-main-weather');
    if(mainWeather)mainWeather.textContent=data.weather;
    const mainDetail=root.querySelector('#ot-main-detail');
    if(mainDetail)mainDetail.textContent='小时降水 '+data.rain+' mm · 风速 '+data.wind+' km/h';
    const details=root.querySelector('#ot-detail-facts');
    if(details)details.innerHTML=facts(data);
    const slider=root.querySelector('#ot-hour');
    if(slider)slider.value=state.hour;
    const exact=root.querySelector('#ot-exact-hour');
    if(exact)exact.value=state.hour;
    const previous=root.querySelector('[data-action="previous-hour"]'),next=root.querySelector('[data-action="next-hour"]');
    if(previous)previous.disabled=state.hour===0;
    if(next)next.disabled=state.hour===state.period-1;
    if(chartGeometry){
      const guide=root.querySelector('#ot-cursor-line'),dot=root.querySelector('#ot-temp-dot');
      if(guide){guide.setAttribute('x1',chartGeometry.horizontal(state.hour));guide.setAttribute('x2',chartGeometry.horizontal(state.hour));}
      if(dot){dot.setAttribute('cx',chartGeometry.horizontal(state.hour));dot.setAttribute('cy',chartGeometry.tempY(data.temperature));}
    }
  }

      else if(state.screen==='weather'&&state.mode==='route'&&state.tab!=='route'){state.tab='route';}
      else if(state.screen==='route-info'){state.screen='weather';state.mode='route';state.tab='route';}
      else if(state.screen==='confirm'){state.screen=state.confirmation.returnScreen;state.confirmation=null;}
      else state.screen='home';
    }
    else if(name==='plans'){state.screen='home';state.homeTab='plans';}
    else if(name==='favorites'){state.screen='home';state.homeTab='points';}
    else if(name==='route-library'){state.screen='home';state.homeTab='routes';}
    else if(name==='home-tab'){state.homeTab=button.dataset.tab;}
    else if(name==='open-plan'){
      selectPlan(button.dataset.plan||state.currentPlanId);
    }
    else if(name==='open-route'){
      selectRoute(button.dataset.route);
    }
    else if(name==='open-point'){openPoint(button.dataset.point);}
    else if(name==='map'){state.mapReturn=state.screen;state.screen='map';state.mapFailed=false;state.pickerChoice=basePoints[0].id;}
    else if(name==='map-fail'){state.mapFailed=true;}
    else if(name==='cancel-map'){state.screen=state.mapReturn||'home';}
    else if(name==='coordinate'){state.screen='coordinate';}
    else if(name==='import'){state.screen='import';state.importPoints=null;pendingOriginal=null;}
    else if(name==='confirm-map'){openPoint(state.pickerChoice);notify('地图返回结果演示 · 未调用真实地图服务。');}
    else if(name==='tab'){state.tab=button.dataset.tab;}
    else if(name==='day'){state.day=Number(button.dataset.day);state.date=dateAdd(state.startDate,state.day-1);}
    else if(name==='node'){selectStop(button.dataset.stop);}
    else if(name==='edit-plan'){beginEdit();}
    else if(name==='cancel-plan'){state.draft=null;state.screen='weather';}
    else if(name==='copy-plan'){beginEdit();if(state.draft){state.draft.id=null;state.draft.name+=' · 副本';notify('复制为新行程，原日期和时间仅作起点，请核对并调整。');}}
    else if(name==='add-visit'){const location=state.points[0];state.draft.stops.push({id:uniqueId('visit'),pointId:location.id,pointSnapshot:clone(location),day:state.draft.stops.at(-1)?.day||1,time:'',event:'arrive'});}
    else if(name==='remove-visit'){if(state.draft.stops.length>1)state.draft.stops=state.draft.stops.filter(stop=>stop.id!==button.dataset.stop);}
    else if(name==='move-visit'){const index=state.draft.stops.findIndex(stop=>stop.id===button.dataset.stop),destination=index+Number(button.dataset.direction);if(destination>=0&&destination<state.draft.stops.length){const moved=state.draft.stops.splice(index,1)[0];state.draft.stops.splice(destination,0,moved);}}
    else if(name==='period'){state.period=Number(button.dataset.period);state.hour=Math.min(state.hour,state.period-1);}
    else if(name==='previous-hour'){updateHour(state.hour-1);remember();return;}
    else if(name==='next-hour'){updateHour(state.hour+1);remember();return;}
    else if(name==='favorite'){
      const location=point();
      const existing=state.favoritePlaces.findIndex(place=>place.id===location.id);
      if(existing>=0){state.management={kind:'place',id:location.id};state.screen='manage';}
      else{
        state.favoritePlaces.push(clone(location));dirtyAssets();notify('地点已加入主动收藏 · '+syncLabel());
      }
    }else if(name==='sync'){state.screen='sync';}
    else if(name==='login-demo'){state.signedIn=true;notify('已模拟登录，尚未导入本机资产。');}
    else if(name==='confirm-sync'){if(['offline','expired'].includes(state.scenario)){notify('当前离线，尚未导入。恢复网络后重试。');}else{state.cloudLinked=true;state.syncStatus='synced';notify('已模拟确认导入；未真实上传任何文件或数据。');}}
    else if(name==='keep-local'){state.screen='home';notify('本机数据保持独立，尚未绑定账户同步。');}
    else if(name==='retry-sync'){if(['offline','expired'].includes(state.scenario)){state.syncStatus='pending';notify('离线无法同步，修改保留在本机待同步。');}else{state.syncStatus='synced';notify('同步成功仅为演示，不连接真实云端。');}}
    else if(name==='logout-demo'){state.signedIn=false;state.cloudLinked=false;state.syncStatus='local';state.conflict=null;notify('已退出演示账户；原型样例仍留本机，正式版需按账户隔离。');}
    else if(name==='keep-both'){if(state.conflict){const remote=clone(state.conflict.remote);remote.id=uniqueId('plan');remote.name+=' · 云端版本副本';state.planRecords.push(remote);state.conflict=null;state.syncStatus='synced';notify('已保留本机版及独立副本，两版均未被覆盖。');}}
    else if(name==='route-info'){state.screen='route-info';}
    else if(name==='view-original'){state.screen='original';}
    else if(name==='manage'){state.management={kind:button.dataset.kind,id:button.dataset.id};state.screen='manage';}
    else if(name==='manage-plan-edit'||name==='manage-plan-copy'){selectPlan(state.management.id);beginEdit();if(name==='manage-plan-copy'&&state.draft){state.draft.id=null;state.draft.name+=' · 副本';}}
    else if(name==='manage-route-info'){selectRoute(state.management.id);state.screen='route-info';}
    else if(name==='delete-asset'){
      const record=managedRecord(),references=state.management.kind==='route'?state.planRecords.filter(plan=>plan.routeId===record.id).length:0;
      if(references){notify('该路线被 '+references+' 个个人行程引用，请先删除这些行程或更换关联路线。');}
      else{state.confirmation={type:'delete',title:'确认删除'+record.name+'？',message:state.management.kind==='plan'?'只删除个人天气行程，不删除路线、不修改活动。':'仅删除这项主动保存，不清除最近查询；本原型不执行真实云端删除。',returnScreen:'manage'};state.screen='confirm';}
    }
    else if(name==='clear-recents'){state.confirmation={type:'recents',title:'清除最近查询？',message:'只清除本机查询历史，主动保存的地点、路线和行程不受影响。',returnScreen:'home'};state.screen='confirm';}
    else if(name==='cancel-operation'){state.screen=state.confirmation.returnScreen;state.confirmation=null;}
    else if(name==='confirm-operation'){
      if(state.confirmation.type==='discard'){state.draft=null;state.screen='weather';}
      else if(state.confirmation.type==='recents'){state.recentQueries=[];state.screen='home';}
      else{const kind=state.management.kind,key=kind==='place'?'favoritePlaces':kind==='route'?'routeRecords':'planRecords';state[key]=state[key].filter(record=>record.id!==state.management.id);if(kind==='route')originalFiles.delete(state.management.id);dirtyAssets();state.screen='home';state.homeTab=kind==='place'?'points':kind==='route'?'routes':'plans';}
      state.confirmation=null;notify('操作完成（原型）。');
    }
    else if(name==='recent'){const record=state.recentQueries.find(item=>item.key===button.dataset.key);if(record.kind==='point'){state.customPoint=clone(record.location);openPoint(record.id);}else if(record.kind==='plan')selectPlan(record.id);else selectRoute(record.id);}
    else if(name==='retry-weather'){state.scenario='normal';notify('已切回正常样例，不代表真实请求成功。');}
    else if(name==='available-date'){state.date='2026-10-31';state.scenario='normal';}
    else if(name==='sample-import'){state.importPoints=clone(basePoints);state.importName='格聂两日路线.gpx';pendingOriginal=null;}
    else if(name==='confirm-import'){
      const selected=Array.from(root.querySelectorAll('[data-import-point]:checked')).map(input=>input.dataset.importPoint);
      if(selected.length<2){root.querySelector('#ot-import-error').textContent='至少保留两个关键节点。';return;}
      const selectedPoints=state.importPoints.filter(location=>selected.indexOf(location.id)>=0),routeName=(root.querySelector('#ot-import-name').value||'').trim();
      if(!routeName||selectedPoints.some(location=>!location.name.trim())){root.querySelector('#ot-import-error').textContent='请填写路线和所选节点名称。';return;}
      state.points=selectedPoints;state.routeName=routeName;
      state.planName=state.routeName+' · 待安排行程';
      state.stops=state.points.map((location,index)=>({id:uniqueId('visit'),pointId:location.id,pointSnapshot:clone(location),day:1,time:'',event:index===0?'depart':'arrive'}));
      state.pointId=state.points[0].id;state.savedRoute=true;state.savedPlan=false;state.currentPlanId=null;state.currentRouteId=uniqueId('route');state.startDate='2026-10-31';state.fromActivity=false;state.routeUpdates=[];
      state.routeRecords.push({id:state.currentRouteId,name:state.routeName,points:clone(state.points),revision:1,accessible:true,sourceName:state.importName,sourceKind:pendingOriginal?'file':'sample'});
      if(pendingOriginal)originalFiles.set(state.currentRouteId,pendingOriginal);
      pendingOriginal=null;dirtyAssets();openRoute();state.importPoints=null;
      notify('路线已保存到原型路线库。尚未安排抵达时间，可直接逐点查询。');
    }else if(name==='from-activity'){
      selectRoute('route-base');if(routeAvailable()){state.stops[0].time='08:00';state.startDate='2026-10-31';state.planName='活动路线 · 我的天气计划';state.fromActivity=true;}
      notify('已带入示例活动路线与出发时间，当前计划仅属于你。');
    }
    render();remember();
  });
  root.addEventListener('input',event=>{
    const target=event.target;
    if(target.id==='ot-hour'){updateHour(Number(target.value));}
    if(target.dataset.importName&&state.importPoints){state.importPoints.find(location=>location.id===target.dataset.importName).name=target.value;}
    if(state.draft){
      if(target.id==='ot-plan-name')state.draft.name=target.value;
      if(target.id==='ot-start-date')state.draft.date=target.value;
      if(target.dataset.editTime)state.draft.stops.find(stop=>stop.id===target.dataset.editTime).time=target.value;
    }
  });
  root.addEventListener('change',async event=>{
    const target=event.target;
    if(target.id==='ot-node'){const tab=state.tab;selectStop(target.value);state.tab=tab;render();remember();}
    else if(target.id==='ot-query-date'&&target.value){state.date=target.value;render();remember();}
    else if(target.name==='ot-map-point'){state.pickerChoice=target.value;}
    else if(target.dataset.editDay&&state.draft){state.draft.stops.find(stop=>stop.id===target.dataset.editDay).day=Number(target.value);}
    else if(target.dataset.editEvent&&state.draft){state.draft.stops.find(stop=>stop.id===target.dataset.editEvent).event=target.value;}
    else if(target.dataset.editPoint&&state.draft){const stop=state.draft.stops.find(item=>item.id===target.dataset.editPoint);stop.pointId=target.value;stop.pointSnapshot=clone(byId(target.value));}
    else if(target.id==='ot-height-window'){state.heightWindow=target.value;render();remember();}
    else if(target.id==='ot-exact-hour'){updateHour(Number(target.value));remember();}
    else if(target.id==='ot-hour'){remember();}
    else if(target.id==='ot-gpx-file'&&target.files[0]){
      const file=target.files[0],error=root.querySelector('#ot-import-error');
      if(file.size>2*1024*1024){error.textContent='原型预览上限为 2 MB，请使用较小的 GPX。';return;}
      try{
        const originalText=await file.text();
        if(state.screen!=='import'||!target.isConnected)return;
        const documentData=new DOMParser().parseFromString(originalText,'application/xml');
        if(documentData.querySelector('parsererror'))throw new Error('GPX 文件格式无法解析。');
        const waypoints=Array.from(documentData.getElementsByTagNameNS('*','wpt')),routePoints=Array.from(documentData.getElementsByTagNameNS('*','rtept')),trackPoints=Array.from(documentData.getElementsByTagNameNS('*','trkpt'));
        const candidates=waypoints.length>=2?waypoints:routePoints.length>=2?routePoints:trackPoints;
        const valid=candidates.filter(element=>['lat','lon'].every(attribute=>element.hasAttribute(attribute)&&element.getAttribute(attribute).trim()!==''&&Number.isFinite(Number(element.getAttribute(attribute))))&&Math.abs(Number(element.getAttribute('lat')))<=90&&Math.abs(Number(element.getAttribute('lon')))<=180);
        if(valid.length<2)throw new Error('至少需要两个有效轨迹点。');
        const count=Math.min(6,valid.length);
        state.importPoints=Array.from({length:count},(_,index)=>{
          const element=valid[Math.round(index*(valid.length-1)/(count-1))];
          const elevationElement=element.getElementsByTagNameNS('*','ele')[0];
          const nameElement=element.getElementsByTagNameNS('*','name')[0];
          const timeElement=element.getElementsByTagNameNS('*','time')[0];
          const elevation=elevationElement&&elevationElement.textContent.trim()!==''?Number(elevationElement.textContent):null;
          return {id:uniqueId('gpx'),name:nameElement&&nameElement.textContent.trim()?nameElement.textContent.slice(0,40):(index===0?'轨迹起点':index===count-1?'轨迹终点':'候选点 '+index),lat:Number(element.getAttribute('lat')),lng:Number(element.getAttribute('lon')),ele:Number.isFinite(elevation)?Math.round(elevation):null,kind:waypoints.length>=2?'GPX航点':'GPX候选点',coordinateSystem:'WGS-84',gpxTime:timeElement?timeElement.textContent.trim():null};
        });
        state.importName=file.name;pendingOriginal={name:file.name,text:originalText};render();
      }catch(problem){error.textContent=problem.message||'读取失败，请换一个 GPX 文件。';}
    }
  });
  root.addEventListener('submit',event=>{
    event.preventDefault();
    if(event.target.id==='ot-plan-form'){
      const draft=state.draft;
      const error=root.querySelector('#ot-plan-error');
      if(!draft.name.trim()||!draft.date){error.textContent='请填写计划名称与出发日期。';return;}
      let previous=-1,previousDay=0;
      for(const stop of draft.stops){
        if(!byId(stop.pointId)){error.textContent='有节点已从最新路线移除，请重新选择或移除此经过。';return;}
        const value=(stop.day-1)*1440+(stop.time?Number(stop.time.slice(0,2))*60+Number(stop.time.slice(3)):0);
        if(stop.day<previousDay){error.textContent='节点所属日期须按路线顺序递增。';return;}
        if(stop.time&&value<previous){error.textContent='节点抵达时间须按路线顺序递增；跨天请调整“第几天”。';return;}
        previousDay=stop.day;
        if(stop.time)previous=value;
      }
      state.planName=draft.name.trim();state.startDate=draft.date;state.stops=clone(draft.stops);state.currentPlanId=draft.id||uniqueId('plan');state.savedPlan=true;
      const saved={id:state.currentPlanId,routeId:state.currentRouteId,name:state.planName,startDate:state.startDate,stops:clone(state.stops),fromActivity:state.fromActivity};
      const existing=state.planRecords.findIndex(plan=>plan.id===saved.id);
      if(existing>=0)state.planRecords[existing]=saved;else state.planRecords.push(saved);
      state.draft=null;dirtyAssets();openRoute();
      notify('个人计划已保存（原型）· 不会修改活动或原始轨迹。');
      render();remember();
    }else if(event.target.id==='ot-coordinate-form'){
      const data=new FormData(event.target);
      const latitudeText=String(data.get('latitude')).trim(),longitudeText=String(data.get('longitude')).trim();
      const latitude=Number(latitudeText),longitude=Number(longitudeText);
      const elevation=String(data.get('elevation')).trim();
      if(!latitudeText||!longitudeText||!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180){root.querySelector('#ot-coordinate-error').textContent='请填写有效经纬度，空白不能当作 0。';return;}
      if(elevation!==''&&(!Number.isFinite(Number(elevation))||Number(elevation)<-500||Number(elevation)>9000)){root.querySelector('#ot-coordinate-error').textContent='海拔应在 -500 至 9000 米之间，未知请留空。';return;}
      state.customPoint={id:'manual-'+Date.now(),name:String(data.get('name')).trim()||'坐标查询点',lat:latitude,lng:longitude,ele:elevation===''?null:Number(elevation),manual:true,coordinateSystem:data.get('coordinateSystem')};
      state.pointId=state.customPoint.id;state.mode='point';state.screen='weather';state.tab='hourly';state.date='2026-10-31';state.hour=13;state.period=24;state.heightWindow='auto';addRecent('point',state.customPoint);notify('坐标系已记录，原型未执行真实转换或天气查询。');
      render();remember();
    }else if(event.target.id==='ot-manage-form'){
      const data=new FormData(event.target),record=managedRecord(),name=String(data.get('name')).trim(),error=root.querySelector('#ot-manage-error');
      if(!name){error.textContent='名称不能为空。';return;}
      if(state.management.kind==='place'){
        const latitudeText=String(data.get('latitude')).trim(),longitudeText=String(data.get('longitude')).trim(),elevationText=String(data.get('elevation')).trim();
        if(!latitudeText||!longitudeText||!Number.isFinite(Number(latitudeText))||!Number.isFinite(Number(longitudeText))||Math.abs(Number(latitudeText))>90||Math.abs(Number(longitudeText))>180){error.textContent='请填写有效经纬度。';return;}
        if(elevationText!==''&&(!Number.isFinite(Number(elevationText))||Number(elevationText)<-500||Number(elevationText)>9000)){error.textContent='请检查海拔范围。';return;}
        record.lat=Number(latitudeText);record.lng=Number(longitudeText);record.ele=elevationText===''?null:Number(elevationText);record.manual=true;
      }
      record.name=name;dirtyAssets();notify('已保存修改（原型）· '+syncLabel());render();remember();
    }
  });
  root.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.target.tagName!=='INPUT')return;
    const form=event.target.closest('form');
    if(!form)return;
    event.preventDefault();
    if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  });
  root.addEventListener('pointerdown',event=>{
    const hit=event.target.closest('#ot-chart-hit');
    if(!hit||!chartGeometry)return;
    hit.setPointerCapture(event.pointerId);
    const chart=root.querySelector('#ot-chart');
    updateHour((event.clientX-chart.getBoundingClientRect().left-chartGeometry.left)/chartGeometry.width*(state.period-1));
  });
  root.addEventListener('pointermove',event=>{
    if(!event.target.closest('#ot-chart-hit')||!event.buttons||!chartGeometry||framePending)return;
    framePending=true;
    requestAnimationFrame(()=>{
      const chart=root.querySelector('#ot-chart');
      if(chart)updateHour((event.clientX-chart.getBoundingClientRect().left-chartGeometry.left)/chartGeometry.width*(state.period-1));
      framePending=false;
    });
  });
  root.addEventListener('pointerup',event=>{if(event.target.closest('#ot-chart-hit'))remember();});
  document.getElementById('ot-demo-scenario').addEventListener('change',event=>{
    state.scenario=event.target.value;settings.scenario=state.scenario;state.toast='';render();remember();
  });
  document.getElementById('ot-weather-preview').addEventListener('click',event=>{
    const button=event.target.closest('[data-demo]');
    if(!button)return;
    state.toast='';
    if(button.dataset.demo==='update')simulateRouteUpdate();
    else if(button.dataset.demo==='revoke'){
      const route=routeRecord();
      if(route){route.accessible=false;state.screen='weather';state.mode='route';state.tab='route';notify('已模拟失去路线访问权限。缓存与个人安排仍保留，但不声称路线最新。');}
    }else if(button.dataset.demo==='conflict'){
      const local=state.planRecords.find(plan=>plan.id===state.currentPlanId)||state.planRecords[0];
      if(local){state.signedIn=true;state.cloudLinked=true;state.syncStatus='conflict';const remote=clone(local);remote.startDate=dateAdd(remote.startDate,1);state.conflict={local:clone(local),remote};state.screen='sync';}
      else notify('先保存一个个人行程，再演示冲突。');
    }else if(button.dataset.demo==='activity'){state.screen='activity';}
    else if(button.dataset.demo==='reset'){state=clone(initial);settings.scenario='normal';pendingOriginal=null;originalFiles.clear();}
    render();remember();
  });
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{
      state.toast='';state.scenario=settings.scenario;
      if(settings.scene==='天气首页')state.screen='home';
      else if(settings.scene==='沿途天气')openRoute();
      else if(settings.scene==='单点云层'){openPoint('lookout','cloud');}
      else if(settings.scene==='行程编辑'){beginEdit();}
      else if(settings.scene==='活动入口')state.screen='activity';
      render();
    }});
    tweak.addSelect(settings,'scene',{label:'查看场景',options:['沿途天气','天气首页','单点云层','行程编辑','活动入口']});
    tweak.addSelect(settings,'scenario',{label:'数据状态',options:[{label:'正常示例',value:'normal'},{label:'部分云层缺测',value:'partial'},{label:'全部云层缺测',value:'missing'},{label:'超出预报范围',value:'outside'},{label:'离线旧缓存',value:'offline'},{label:'离线缓存过期',value:'expired'},{label:'加载中',value:'loading'},{label:'请求失败',value:'error'}]});
    tweak.addSlider(settings,'width',{label:'小程序宽度',min:320,max:430,step:1,unit:'px'});
  }
})();
</script>
